spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Puerto que asigna Render (por defecto 8080)
server.port=${PORT:8080}

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Base de datos (ver docker-compose.yml / variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: Secreto y tiempo de expiración (1 hora = 3600000 ms)
app.jwt.secreto=${JWT_SECRETO:esta-es-una-clave-secreta-de-prueba-para-jwt-debe-ser-larga-y-segura-123456}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}
